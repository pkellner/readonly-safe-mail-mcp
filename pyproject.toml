[project]
name = "readonly-safe-mail-mcp"
version = "0.3.1"
description = "Read-only, redacting, multi-account mail, contacts and calendar MCP server with local sanitized search indexes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "pyyaml>=6",
  "keyring>=25",
  "truststore>=0.10",
  # XML without entities or external references: DAV responses (dav.py) and Office files.
  "defusedxml>=0.7",
  # Attachment readers. They only ever run inside the sandboxed worker (extract.py).
  "pypdf>=6",
  "pillow>=11",
  "pillow-heif>=0.20",
  # Calendar repeat rules, expanded only in the expansion worker (expand.py).
  "python-dateutil>=2.8.2",
  # zoneinfo has no system time-zone database on Windows.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "trustme>=1.1"]

[project.scripts]
readonly-safe-mail-mcp = "readonly_safe_mail_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readonly_safe_mail_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures contain long literal IMAP responses and email bodies.
"tests/*" = ["E501", "B008"]
